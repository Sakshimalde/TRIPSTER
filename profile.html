<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="profile.css">
<body>
    <!-- Profile Header -->
<div class="profile-header">
    <input type="file" id="profile-picture" accept="image/*">
    <label for="profile-picture">Upload Profile Picture</label>
    <input type="text" id="username" placeholder="Username">
    <input type="number" id="age" placeholder="Age">
  </div>
  
  <!-- Bio Section -->
  <div class="bio-section">
    <input type="text" id="headline" placeholder="Headline">
    <textarea id="bio" placeholder="Bio"></textarea>
    <input type="text" id="interest-1" placeholder="Interest 1">
    <input type="text" id="interest-2" placeholder="Interest 2">
    <input type="text" id="interest-3" placeholder="Interest 3">
  </div>
  
  <!-- Profile Information -->
  <div class="profile-info">
    <input type="text" id="location" placeholder="Location">
    <input type="text" id="occupation" placeholder="Occupation">
    <input type="text" id="education" placeholder="Education">
  </div>
  
  <!-- Media Section -->
  <div class="media-section">
    <input type="file" id="photo-1" accept="image/*">
    <label for="photo-1">Upload Photo 1</label>
    <input type="file" id="photo-2" accept="image/*">
    <label for="photo-2">Upload Photo 2</label>
    <input type="file" id="photo-3" accept="image/*">
    <label for="photo-3">Upload Photo 3</label>
    <input type="file" id="video-1" accept="video/*">
    <label for="video-1">Upload Video 1</label>
  </div>
  
  <!-- Call-to-Action (CTA) Buttons -->
  <div class="cta-buttons">
    <button id="create-profile-btn">Create Profile</button>
  </div>
  
  <!-- Profile Preview -->
  <div class="profile-preview" style="display: none;">
    <!-- Profile Header -->
    <div class="profile-header">
      <img src="" alt="Profile Picture" class="profile-picture">
      <h2 class="username"></h2>
      <p class="age"></p>
    </div>
  
    <!-- Bio Section -->
    <div class="bio-section">
      <h3 class="headline"></h3>
      <p class="bio"></p>
      <ul class="interests">
        <li></li>
        <li></li>
        <li></li>
      </ul>
    </div>
  
    <!-- Profile Information -->
    <div class="profile-info">
      <p class="location"></p>
      <p class="occupation"></p>
      <p class="education"></p>
    </div>
  
    <!-- Media Section -->
    <div class="media-section">
      <div class="photo-gallery">
        <img src="" alt="Photo 1">
        <img src="" alt="Photo 2">
        <img src="" alt="Photo 3">
      </div>
      <div class="video-section">
        <video src="" alt="Video 1"></video>
      </div>
    </div>
  </div>
</body>
</html>
