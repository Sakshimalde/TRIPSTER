<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">
  <link rel="stylesheet" href="home.css">
  <title>TRIPSTER</title>
</head>

<body>


  <!-- Optional JavaScript; choose one of the two! -->

  <!-- Option 1: Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- Option 2: Separate Popper and Bootstrap JS -->
  <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    -->

  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="#">About Us</a></li>
      <li><a href="#">Help/FAQ</a></li>
      <li class="dropdown">
        <a href="#" class="dropdown-toggle">Login/Register</a>
        <ul class="dropdown-menu">
          <li><a class="login" href="#">Login</a></li>
          <li><a class="register" href="#">Register</a></li>
        </ul>
      </li>
    </ul>
  </nav>
  <div class="carousel-container">
    <div class="carousel">
        <div class="carousel-slide">
            <img src="https://cdn.fodors.com/wp-content/uploads/2017/09/Road-Trips-Cabot-Trail.jpg" alt="Image 1">
        </div>
        <div class="carousel-slide">
            <img src="https://th.bing.com/th/id/OIP.7XVJHgvpV_zfV4Bexz7peAHaDt?w=2400&h=1200&rs=1&pid=ImgDetMain" alt="Image 2">
        </div>
        <div class="carousel-slide">
            <img src="https://thumbs.dreamstime.com/b/sunshine-road-single-point-perspective-down-country-highway-summer-sunny-to-anywhere-warm-day-to-drive-travel-to-anywhere-85659383.jpg" alt="Image 3">
        </div>
    </div>
    <button class="prev" onclick="prevSlide()">&#10094;</button>
    <button class="next" onclick="nextSlide()">&#10095;</button>
</div>
  <div id="login-form-container" class="form-container" style="display: none;">
    <form>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password"><br><br>
      <input type="submit" value="Login">
    </form>
  </div>
  <div id="register-form-container" class="form-container" style="display: none;">
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name"><br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password"><br><br>
      <label for="birthday">Birthday:</label>
      <input type="date" id="birthday" name="birthday"><br><br>
      <label for="gender">Gender:</label>
      <select id="gender" name="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="non-binary">Non-Binary</option>
      </select><br><br>
      <label for="bio">Bio:</label>
      <textarea id="bio" name="bio"></textarea><br><br>
      <input type="submit" value="Register">
    </form>
  </div>
</body>
<script src="home.js"></script>

</html>
