<!-- public/friends.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .friends { margin: 20px; }
    </style>
</head>
<body>
    <div class="friends" id="friends"></div>

    <script>
        const userId = 1; // Change this to the logged-in user's ID

        fetch(`http://localhost:5000/api/friends/${userId}`)
            .then(response => response.json())
            .then(friends => {
                const friendsDiv = document.getElementById('friends');
                friendsDiv.innerHTML = `
                    <h1>Friends</h1>
                    <ul>
                        ${friends.map(friend => `<li>${friend.username}</li>`).join('')}
                    </ul>
                `;
            });
    </script>
</body>
</html>
