<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tripster - Solo Travel Matchmaking</title>
    <link rel="stylesheet" href="form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Tripster</h1>
        </header>

        <section id="profile">
            <h2>User Profile</h2>
            <form id="profile-form">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" required>
                </div>
                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" required>
                </div>
                <div class="input-group">
                    <label for="preferences">Travel Preferences (select destination)</label>
                    <select id="destination" required>
                        <option value="">Select a City</option>
                        <!-- Cities will be dynamically populated here -->
                    </select>
                </div>
                <div class="input-group">
                    <label for="budget">Budget (in INR):</label>
                    <input type="range" id="budget" min="0" max="100000" step="1000" value="50000">
                    <span id="budget-value">50000</span>
                </div>
                <div class="input-group">
                    <label for="interests">Interests (comma-separated):</label>
                    <input type="text" id="interests" placeholder="Adventure, Culture, Nature, Food, Photography" required>
                </div>
                <button type="submit">Save Profile</button>
            </form>
        </section>

        <section id="search">
            <h2>Search & Match</h2>
            <form id="search-form">
                <div class="input-group">
                    <label for="search-destination">Destination</label>
                    <input type="text" id="search-destination" required>
                </div>
                <div class="input-group">
                    <label for="travel-dates">Travel Dates</label>
                    <input type="text" id="travel-dates" placeholder="Select your travel dates" required>
                </div>
                <div class="input-group">
                    <label for="interests-search">Interests</label>
                    <input type="text" id="interests-search" required placeholder="Adventure, Culture, etc.">
                </div>
                <button type="submit">Find Matches</button>
            </form>
            <div id="matches"></div>
        </section>

        <section id="trip-planning">
            <h2>Trip Planning & Messaging</h2>
            <div id="messages">
                <h3>Messages</h3>
                <ul id="message-list"></ul>
                <textarea id="new-message" placeholder="Type your message..."></textarea>
                <button id="send-message">Send</button>
            </div>
            <div id="itinerary">
                <h3>Collaborative Itinerary</h3>
                <textarea id="itinerary-details" placeholder="Add itinerary details..."></textarea>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
    <script>
        // Initialize the date picker
        flatpickr("#travel-dates", {
            mode: "range",
            dateFormat: "Y-m-d",
            minDate: "today",
            altInput: true,
            altFormat: "F j, Y",
        });

        // Update budget value display
        const budgetSlider = document.getElementById('budget');
        const budgetValue = document.getElementById('budget-value');

        budgetSlider.oninput = function() {
            budgetValue.innerText = this.value;
        };

        // Fetch Indian cities and populate the dropdown
        async function fetchCities() {
            try {
                const response = await fetch('https://api.geonames.org/countryInfoJSON?formatted=true&country=IN&username=your_username'); // Replace your_username with your actual Geonames username
                const data = await response.json();

                const cityDropdown = document.getElementById('destination');
                
                // Example of how to append city options (you may need a different API for city names specifically)
                data.geonames.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city.name; // Use city name from API
                    option.textContent = city.name; // Use city name for display
                    cityDropdown.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching cities:', error);
            }
        }

        fetchCities();
    </script>

</body>
</html>
